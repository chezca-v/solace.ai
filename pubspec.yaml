name: solace_ai
description: "A private, on-device AI journaling sanctuary built with Flutter."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & File Management
  dio: ^5.11.1
  path_provider: ^2.1.6
  path: ^1.9.1

  # On-Device AI
  flutter_gemma: ^1.11.2
  flutter_gemma_mediapipe: ^1.0.6
  speech_to_text: ^6.6.0

  # Local Persistence
  sqflite: ^2.4.1
  flutter_svg: ^2.3.0
  go_router: ^18.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.9
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/images/
    - assets/animations/
    - assets/dashboard.html

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/SolaceLogo.png
  remove_alpha_ios: true
  background_color_ios: "#B7E4D7"
  adaptive_icon_background: "#B7E4D7"
  adaptive_icon_foreground: assets/brand/SolaceLogo.png
  web:
    generate: true
    image_path: assets/brand/SolaceLogo.png
    background_color: "#FAF8F2"
    theme_color: "#78917A"
  windows:
    generate: true
    image_path: assets/brand/SolaceLogo.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/brand/SolaceLogo.png
