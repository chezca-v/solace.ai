<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_29 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_29" style="display:block;"><svg class="overflow-visible" height="140" viewBox="0 0 140 140" width="140" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Dynamic Glowing Radial Gradient -->
<radialGradient cx="50%" cy="50%" id="solRadialBody" r="50%">
<stop offset="0%" stop-color="#FFF8B8">
<animate attributeName="stop-color" dur="4s" repeatCount="indefinite" values="#FFF8B8;#FFF385;#FFF8B8"></animate>
</stop>
<stop offset="65%" stop-color="#FFD166"></stop>
<stop offset="100%" stop-color="#FF9E00" stop-opacity="0.95"></stop>
</radialGradient>
<!-- Warm Golden Halo Gradient -->
<radialGradient cx="50%" cy="50%" id="solGlowHalo" r="50%">
<stop offset="0%" stop-color="#FFEAA7" stop-opacity="0.85"></stop>
<stop offset="60%" stop-color="#FFD166" stop-opacity="0.35"></stop>
<stop offset="100%" stop-color="#4CAF82" stop-opacity="0"></stop>
</radialGradient>
<!-- Aura Blur Filter -->
<filter height="200%" id="ambientSoftGlow" width="200%" x="-50%" y="-50%">
<feGaussianBlur result="blur" stdDeviation="7"></feGaussianBlur>
<feMerge>
<feMergeNode in="blur"></feMergeNode>
<feMergeNode in="SourceGraphic"></feMergeNode>
</feMerge>
</filter>
<style>
      @keyframes solFloat {
        0%, 100% {
          transform: translateY(0px) rotate(0deg);
        }
        25% {
          transform: translateY(-4px) rotate(1.5deg);
        }
        50% {
          transform: translateY(-8px) rotate(0deg);
        }
        75% {
          transform: translateY(-3px) rotate(-1.5deg);
        }
      }

      @keyframes solAuraBreathe {
        0%, 100% {
          transform: scale(0.92);
          opacity: 0.55;
        }
        50% {
          transform: scale(1.15);
          opacity: 0.95;
        }
      }

      @keyframes solRaysRotate {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes solRayPulse {
        0%, 100% {
          stroke-width: 4px;
          opacity: 0.7;
        }
        50% {
          stroke-width: 5.5px;
          opacity: 1;
        }
      }

      @keyframes solSproutWave {
        0%, 100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(18deg);
        }
      }

      @keyframes solBlink {
        0%, 94%, 98%, 100% {
          transform: scaleY(1);
        }
        96% {
          transform: scaleY(0.1);
        }
      }

      @keyframes solCheekGlow {
        0%, 100% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.18);
          opacity: 0.98;
        }
      }

      .floating-group {
        animation: solFloat 4s ease-in-out infinite;
        transform-origin: 70px 70px;
      }

      .aura-pulse {
        animation: solAuraBreathe 3s ease-in-out infinite;
        transform-origin: 70px 70px;
      }

      .sun-rays {
        animation: solRaysRotate 28s linear infinite;
        transform-origin: 70px 70px;
      }

      .ray-line {
        animation: solRayPulse 3s ease-in-out infinite;
      }

      .sprout-leaf {
        animation: solSproutWave 2.5s ease-in-out infinite;
        transform-origin: 104px 54px;
      }

      .sol-eyes {
        animation: solBlink 4.5s ease-in-out infinite;
        transform-origin: 70px 62px;
      }

      .sol-cheeks {
        animation: solCheekGlow 3s ease-in-out infinite;
        transform-origin: 70px 72px;
      }
    </style>
</defs>
<!-- Ambient Pulsing Glow Aura behind Sol -->
<g class="floating-group">
<circle class="aura-pulse" cx="70" cy="70" fill="url(#solGlowHalo)" filter="url(#ambientSoftGlow)" r="56"></circle>
<!-- Slowly Rotating Living Rays -->
<g class="sun-rays" stroke="#FFD166" stroke-linecap="round">
<line class="ray-line" x1="70" x2="70" y1="14" y2="4"></line>
<line class="ray-line" x1="70" x2="70" y1="126" y2="136"></line>
<line class="ray-line" x1="14" x2="4" y1="70" y2="70"></line>
<line class="ray-line" x1="126" x2="136" y1="70" y2="70"></line>
<line class="ray-line" x1="30" x2="23" y1="30" y2="23"></line>
<line class="ray-line" x1="110" x2="117" y1="110" y2="117"></line>
<line class="ray-line" x1="30" x2="23" y1="110" y2="117"></line>
<line class="ray-line" x1="110" x2="117" y1="30" y2="23"></line>
</g>
<!-- Glowing Sun Sphere Body -->
<circle cx="70" cy="70" fill="url(#solRadialBody)" filter="drop-shadow(0 6px 16px rgba(255, 178, 36, 0.45))" r="44" stroke="#FFF3B0" stroke-width="2"></circle>
<!-- Cute Cheerful Facial Features -->
<g class="sol-eyes">
<!-- Cheerful Curved Arched Eyes -->
<path d="M 52 64 Q 58 56 64 64" fill="none" stroke="#2D3142" stroke-linecap="round" stroke-width="4"></path>
<path d="M 76 64 Q 82 56 88 64" fill="none" stroke="#2D3142" stroke-linecap="round" stroke-width="4"></path>
</g>
<!-- Living Rosy Cheeks -->
<g class="sol-cheeks">
<circle cx="50" cy="73" fill="#FF8FAB" r="7"></circle>
<circle cx="90" cy="73" fill="#FF8FAB" r="7"></circle>
</g>
<!-- Warm Joyful Smile -->
<path d="M 62 73 Q 70 84 78 73 Z" fill="#2D3142"></path>
<path d="M 65 75 Q 70 82 75 75 Z" fill="#FF6B8B"></path>
<!-- Dynamic Waving Leaf Sprout on Sol's Ear/Shoulder -->
<g class="sprout-leaf">
<path d="M 103 52 C 110 46 117 52 113 60 C 109 64 102 60 103 52 Z" fill="#4CAF82" stroke="#2D3142" stroke-width="1.2"></path>
<circle cx="111" cy="54" fill="#FFFFFF" opacity="0.9" r="1.8"></circle>
</g>
</g>
</svg></div><!-- STITCH_SVG_END:ANIMATION_29 -->


</body></html>
