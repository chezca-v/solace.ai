<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_37 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_37" style="display:block;"><svg height="120" viewbox="0 0 120 120" width="120" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialgradient cx="50%" cy="50%" id="sunGlowEmpatheticAnim" r="50%">
<stop offset="0%" stop-color="#FFF3B0"></stop>
<stop offset="70%" stop-color="#FFD166"></stop>
<stop offset="100%" stop-color="#E76F51" stop-opacity="0.8"></stop>
</radialgradient>
<filter height="180%" id="softGlowEmpatheticAnim" width="180%" x="-40%" y="-40%">
<fegaussianblur result="blur" stddeviation="5.5"></fegaussianblur>
<fecomposite in="SourceGraphic" in2="blur" operator="over"></fecomposite>
</filter>
<style>
      @keyframes gentleHeartbeat {
        0%, 100% { transform: scale(1); opacity: 0.38; }
        50% { transform: scale(1.07); opacity: 0.62; }
      }
      @keyframes comfortingRock {
        0%, 100% { transform: translateY(0px) rotate(-1deg); }
        50% { transform: translateY(-3.5px) rotate(1deg); }
      }
      @keyframes tearShimmer {
        0%, 100% { opacity: 0.6; transform: translateY(0px); }
        50% { opacity: 1; transform: translateY(1.5px); }
      }
      @keyframes blanketSnuggle {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02) translateY(-0.5px); }
      }
      .anim-empathy-aura {
        transform-origin: 60px 58px;
        animation: gentleHeartbeat 3.6s ease-in-out infinite;
      }
      .anim-sol-comfort {
        transform-origin: 60px 65px;
        animation: comfortingRock 3.6s ease-in-out infinite;
      }
      .anim-tear-drop {
        transform-origin: 81px 46px;
        animation: tearShimmer 2.2s ease-in-out infinite;
      }
      .anim-blanket {
        transform-origin: 60px 75px;
        animation: blanketSnuggle 3.6s ease-in-out infinite;
      }
    </style>
</defs>
<!-- Comforting Muted Sage Aura with Warm Breathing Glow -->
<circle class="anim-empathy-aura" cx="60" cy="58" fill="#C5DED0" filter="url(#softGlowEmpatheticAnim)" r="46"></circle>
<!-- Living Comforting Sol -->
<g class="anim-sol-comfort">
<!-- Sun Body -->
<circle cx="60" cy="58" fill="url(#sunGlowEmpatheticAnim)" r="37"></circle>
<!-- Gentle Drooping Eyebrows of Deep Empathy -->
<path d="M 45 44 Q 50 47 55 46" fill="none" stroke="#2D3142" stroke-linecap="round" stroke-width="2.5"></path>
<path d="M 75 44 Q 70 47 65 46" fill="none" stroke="#2D3142" stroke-linecap="round" stroke-width="2.5"></path>
<!-- Gentle Empathetic / Comforting Closed Eyes -->
<path d="M 46 54 Q 51 58 56 54" fill="none" stroke="#2D3142" stroke-linecap="round" stroke-width="3"></path>
<path d="M 64 54 Q 69 58 74 54" fill="none" stroke="#2D3142" stroke-linecap="round" stroke-width="3"></path>
<!-- Shimmering Tiny Emotion / Empathy Bead near temple -->
<path class="anim-tear-drop" d="M 78 46 C 78 44 80 41 81 41 C 82 41 84 44 84 46 C 84 48 81 50 81 50 C 81 50 78 48 78 46 Z" fill="#64B5F6"></path>
<!-- Rosy Pink Cheeks -->
<circle cx="43" cy="62" fill="#FF8FAB" opacity="0.85" r="6"></circle>
<circle cx="77" cy="62" fill="#FF8FAB" opacity="0.85" r="6"></circle>
<!-- Small Caring Gentle Mouth -->
<path d="M 57 65 Q 60 67 63 65" fill="none" stroke="#2D3142" stroke-linecap="round" stroke-width="2.5"></path>
<!-- Sol tightly hugging a warm comfort blanket with cute rounded stitch pattern -->
<g class="anim-blanket" filter="drop-shadow(0 3px 6px rgba(45,49,66,0.15))">
<path d="M 38 72 C 38 68 44 65 60 65 C 76 65 82 68 82 72 C 82 82 76 86 60 86 C 44 86 38 82 38 72 Z" fill="#BEE1D2"></path>
<path d="M 44 75 Q 60 78 76 75" fill="none" stroke="#4CAF82" stroke-dasharray="3,3" stroke-width="2"></path>
<!-- Hugging hands -->
<ellipse cx="44" cy="70" fill="#FFD166" rx="4" ry="3.5" stroke="#2D3142" stroke-width="1.5"></ellipse>
<ellipse cx="76" cy="70" fill="#FFD166" rx="4" ry="3.5" stroke="#2D3142" stroke-width="1.5"></ellipse>
</g>
</g>
</svg></div><!-- STITCH_SVG_END:ANIMATION_37 -->
</body>
</html>
